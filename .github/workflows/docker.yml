name: Docker image

# PR: build + scan + smoke (no registry publish).
# Push to main: publish to GHCR with SBOM + provenance.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "src/**"
      - "docker/**"
      - ".dockerignore"
      - "docker-compose.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "index.html"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "src/**"
      - "docker/**"
      - ".dockerignore"
      - "docker-compose.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "index.html"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aicos-web
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            VITE_USE_MOCK=true
          load: true
          tags: aicos/web:scan
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Trivy SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aicos/web:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-web.sarif
          exit-code: "0"
          trivyignores: .trivyignore
      - name: Upload Trivy SARIF
        if: hashFiles('trivy-web.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web
      - name: Trivy gate (HIGH/CRITICAL with fixes)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aicos/web:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Smoke test
        run: |
          docker run -d --name web -p 8088:8080 aicos/web:scan
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8088/healthz && exit 0
            sleep 2
          done
          docker logs web
          exit 1
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push with SBOM and provenance
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            VITE_USE_MOCK=true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=web

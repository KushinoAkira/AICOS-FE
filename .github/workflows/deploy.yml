name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  firebase:
    name: Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          VITE_USE_MOCK: "true"
        run: pnpm exec vite build
      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_SA: ${{ secrets.FIREBASE }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Add repository secret FIREBASE (Firebase service-account JSON for project aicos-3028a)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13 deploy --only hosting --non-interactive --project aicos-3028a

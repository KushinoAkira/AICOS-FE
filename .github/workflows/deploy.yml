name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  firebase:
    name: Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          VITE_USE_MOCK: "true"
        run: pnpm exec vite build
      - name: Deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Add repository secret FIREBASE_TOKEN (npx firebase-tools login:ci). See docs/ops.md."
            exit 1
          fi
          npx --yes firebase-tools@13 deploy --only hosting --non-interactive --project aicos-3028a
